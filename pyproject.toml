"tests/test_alpha_research.py" = ["E501", "E701", "E702"]
"tests/test_portfolio_research.py" = ["F403", "F405", "E501", "E701", "E702"]
"tests/test_portfolio_validation.py" = ["E501", "E701", "E702"]
"tests/test_portfolio_intelligence.py" = ["E501", "E701", "E702"]
"tests/test_sber_operational.py" = ["E501"]
"src/moex_analytics/dashboard/pages/sber_decision.py" = ["E501", "RUF001"]
