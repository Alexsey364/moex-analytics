"src/moex_analytics/adaptive_learning/**/*.py" = ["E501", "RUF001"]
"src/moex_analytics/predictive_expansion/**/*.py" = ["E501", "RUF001"]
"tests/test_adaptive_learning.py" = ["E501"]
"src/moex_analytics/unblocked_experiment/**/*.py" = ["E501", "E701", "E702", "RUF001"]
"src/moex_analytics/alpha_research/**/*.py" = ["E501", "E701", "E702", "RUF001", "RUF007", "RUF059"]
