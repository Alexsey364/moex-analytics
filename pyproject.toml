[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "moex-analytics"
version = "0.1.0"
description = "Reproducible research platform for Moscow Exchange market data"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Alexsey364"}]
dependencies = [
  "duckdb>=1.1,<2",
  "pandas>=2.2,<3",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "streamlit>=1.40,<2",
  "plotly>=5.24,<7",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
moex-analytics = "moex_analytics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/moex_analytics"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["moex_analytics"]
omit = [
  "src/moex_analytics/cli.py",
  "src/moex_analytics/dashboard/app.py",
  "src/moex_analytics/dashboard/charts.py",
  "src/moex_analytics/dashboard/pages/*.py",
  "src/moex_analytics/macro/experiment.py",
  "src/moex_analytics/macro/audit.py",
  "src/moex_analytics/macro/feature_store.py",
  "src/moex_analytics/macro/loader.py",
]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/moex_analytics/dashboard/**/*.py" = ["RUF001"]
"src/moex_analytics/fundamentals/archive_parser.py" = ["RUF001"]
"src/moex_analytics/fundamentals/normalization.py" = ["RUF001"]
"src/moex_analytics/fundamentals/confidence.py" = ["E501"]
"src/moex_analytics/fundamentals/documents.py" = ["E501"]
"src/moex_analytics/fundamentals/history.py" = ["E501"]
"tests/test_fundamental_history.py" = ["RUF001"]
"src/moex_analytics/database.py" = ["E501"]
"src/moex_analytics/sber_decision/**/*.py" = ["E501", "RUF001"]
"src/moex_analytics/sber_intelligence/**/*.py" = ["E501", "RUF001"]
"src/moex_analytics/dashboard/pages/sber_decision.py" = ["E501", "RUF001"]
"tests/test_sber_decision.py" = ["E501", "RUF001", "RUF005"]
"tests/test_sber_intelligence.py" = ["E501", "RUF001"]
