project:
  timezone: Europe/Moscow
paths:
  raw_data: data/raw
  processed_data: data/processed
  database: database/market.duckdb
  reports: reports
moex_iss:
  base_url: https://iss.moex.com/iss
  timeout_seconds: 30
  connect_timeout_seconds: 10
  read_timeout_seconds: 30
  max_retries: 4
  retry_backoff_seconds: 1.0
  user_agent: moex-analytics/0.1.0
  page_size: 100
analytics:
  calculation_version: factors-regimes-v1
  source: canonical_daily_prices
  minimum_history: 250
  annualization_sessions: 252
  analogue_min_spacing: 20
  analogue_count: 20
  bootstrap_samples: 500
  regime:
    stress_drawdown: -0.20
    stress_volatility_20: 0.35
    recovery_return_20: 0.08
    strong_trend_return_60: 0.10
    moderate_trend_return_60: 0.03
    flat_sma_distance: 0.03
  scoring:
    weights:
      trend: 0.20
      momentum: 0.15
      relative_strength: 0.15
      risk: 0.15
      liquidity: 0.10
      market_regime: 0.10
      historical_analogues: 0.15
    thresholds:
      statistically_favorable: 0.45
      moderately_favorable: 0.15
      moderately_unfavorable: -0.15
      statistically_unfavorable: -0.45
  validation:
    development_end: 2015-12-31
    validation_end: 2020-12-31
    out_of_sample_start: 2021-01-01
macro:
  calculation_version: macro-pit-v1
  model_version: macro-model-v1
  cutoff:
    next_open: "09:50:00"
    next_close: "18:40:00"
    timezone: Europe/Moscow
  horizons: [1, 5, 20, 60, 120, 250]
  walk_forward:
    minimum_train_sessions: 750
    test_sessions: 250
    step_sessions: 250
    untouched_holdout_start: 2024-01-01
  series:
    - {series_id: cbr_usd_rub, source: cbr, code: R01235, point_in_time_safe: true}
    - {series_id: cbr_eur_rub, source: cbr, code: R01239, point_in_time_safe: true}
    - {series_id: cbr_cny_rub, source: cbr, code: R01375, point_in_time_safe: true}
    - {series_id: cbr_key_rate, source: cbr, code: key_rate, point_in_time_safe: true}
    - {series_id: cbr_ruonia, source: cbr, code: ruonia, point_in_time_safe: true}
    - {series_id: rosstat_cpi_yoy, source: rosstat, code: cpi_yoy, point_in_time_safe: false}
    - {series_id: rosstat_cpi_mom, source: rosstat, code: cpi_mom, point_in_time_safe: false}
    - {series_id: moex_cny_rub, source: moex, code: CNYRUB_TOM, point_in_time_safe: true}
    - {series_id: moex_usd_rub, source: moex, code: USDRUB_TOM, point_in_time_safe: true}
    - {series_id: moex_rgbi, source: moex, code: RGBI, point_in_time_safe: true}
    - {series_id: moex_ofz_3y, source: moex, code: RUGBITR3Y, point_in_time_safe: true}
    - {series_id: moex_ofz_5y, source: moex, code: RUGBITR5Y, point_in_time_safe: true}
    - {series_id: moex_ofz_10y, source: moex, code: RUGBITR10Y, point_in_time_safe: true}
    - {series_id: moex_finance, source: moex, code: MOEXFN, point_in_time_safe: true}
    - {series_id: moex_oil_gas, source: moex, code: MOEXOG, point_in_time_safe: true}
    - {series_id: moex_metals, source: moex, code: MOEXMM, point_in_time_safe: true}
    - {series_id: moex_consumer, source: moex, code: MOEXCN, point_in_time_safe: true}
    - {series_id: moex_transport, source: moex, code: MOEXTN, point_in_time_safe: true}
    - {series_id: moex_power, source: moex, code: MOEXEU, point_in_time_safe: true}
    - {series_id: external_brent, source: external, code: brent, point_in_time_safe: false}
    - {series_id: external_gold, source: external, code: gold, point_in_time_safe: false}
