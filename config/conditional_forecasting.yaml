conditional_similarity:
  version: conditional-similarity-v2
  minimum_history: 500
  episode_separation_sessions: 20
  minimum_family_features: 1
  thresholds:
    strong: 75.0
    medium: 60.0
    weak: 45.0
  family_weights:
    price: 0.25
    volatility: 0.15
    market: 0.20
    rates: 0.10
    fx_commodities: 0.10
    sector: 0.10
    fundamental: 0.10
conditional_weighting:
  version: conditional-weighting-v1.1
  similarity_power: 2.0
  minimum_effective_sample: 4.0
  concentrated_max_weight: 0.50
  recency_weighting: none
regime_conditioning:
  version: multidimensional-regime-v1.1
  expected_compatibility: 0.80
  alternative_compatibility: 0.55
  transition_horizons: [20, 60, 120]
barrier_analytics:
  version: first-passage-v1
  horizons: [5, 20, 40, 60, 120, 250]
  symmetric: [0.03, 0.05, 0.075, 0.10, 0.15]
  asymmetric:
    - [0.10, 0.05]
    - [0.15, 0.075]
  minimum_effective_sample: 4.0
historical_validation:
  version: frozen-oos-calibration-v1.1
  schedule_sessions: 20
  minimum_history: 500
  train_fraction: 0.60
  calibration_fraction: 0.20
  frozen_test_fraction: 0.20
  similarity_thresholds: [45.0, 55.0, 65.0]
  default_similarity_threshold: 45.0
  minimum_oos_forecasts: 20
  minimum_effective_sample: 4.0
  target_60_coverage: 0.60
  coverage_60_tolerance: 0.10
  target_80_coverage: 0.80
  coverage_80_tolerance: 0.10
  random_seed: 42
