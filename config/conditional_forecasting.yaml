conditional_similarity:
  version: conditional-similarity-v2
  minimum_history: 500
  episode_separation_sessions: 20
  minimum_family_features: 1
  thresholds:
    strong: 75.0
    medium: 60.0
    weak: 45.0
  family_weights:
    price: 0.25
    volatility: 0.15
    market: 0.20
    rates: 0.10
    fx_commodities: 0.10
    sector: 0.10
    fundamental: 0.10
conditional_weighting:
  version: conditional-weighting-v1.1
  similarity_power: 2.0
  minimum_effective_sample: 4.0
  concentrated_max_weight: 0.50
  recency_weighting: none
regime_conditioning:
  version: multidimensional-regime-v1.1
  expected_compatibility: 0.80
  alternative_compatibility: 0.55
  transition_horizons: [20, 60, 120]
